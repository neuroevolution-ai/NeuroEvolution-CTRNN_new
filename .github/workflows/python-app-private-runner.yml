name: Tests and Checks (self hosted)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ### note: all jobs share the same first steps, and only differ in the last step.
  pytest:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: 3.8.7
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y swig build-essential cmake libgl1-mesa-glx
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test with pytest
        run: |
          PYTHONPATH=./neuro_evolution_ctrnn pytest
  mypy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: 3.8.7
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y swig build-essential cmake libgl1-mesa-glx
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Type Checks with mypy
        run: |
          mypy --follow-imports=normal .
  flake8:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: 3.8.7
      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y swig build-essential cmake libgl1-mesa-glx
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        run: |
          flake8 . --count --max-complexity=10 --max-line-length=127 --extend-ignore E203 --statistics